name: Fabric CD

on:
  workflow_dispatch:
  push:
    branches:
      - feature/github-actions-cd

jobs:
  deploy-dev-to-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Fabric access token
        id: token
        shell: bash
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://api.fabric.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain Fabric access token."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Development to Test
        id: deploy
        shell: bash
        env:
          FABRIC_TOKEN: ${{ steps.token.outputs.token }}
          DEPLOYMENT_PIPELINE_ID: ${{ vars.FABRIC_DEPLOYMENT_PIPELINE_ID }}
          DEV_STAGE_ID: ${{ vars.FABRIC_DEV_STAGE_ID }}
          TEST_STAGE_ID: ${{ vars.FABRIC_TEST_STAGE_ID }}
        run: |
          HEADERS_FILE=$(mktemp)
          BODY_FILE=$(mktemp)

          HTTP_CODE=$(curl -sS \
            -D "$HEADERS_FILE" \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -X POST \
            "https://api.fabric.microsoft.com/v1/deploymentPipelines/${DEPLOYMENT_PIPELINE_ID}/deploy" \
            -H "Authorization: Bearer ${FABRIC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sourceStageId\": \"${DEV_STAGE_ID}\",
              \"targetStageId\": \"${TEST_STAGE_ID}\",
              \"note\": \"GitHub Actions Dev to Test deployment\"
            }")

          echo "Fabric deployment HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Deployment completed immediately."
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP_CODE" != "202" ]; then
            echo "Deployment request failed:"
            cat "$BODY_FILE"
            exit 1
          fi

          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {print $2}' "$HEADERS_FILE" | tr -d '\r')

          if [ -z "$LOCATION" ]; then
            echo "Fabric returned 202 but no Location header."
            exit 1
          fi

          echo "operation_url=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "completed=false" >> "$GITHUB_OUTPUT"

          echo "Deployment started asynchronously."

      - name: Wait for deployment to finish
        if: steps.deploy.outputs.completed != 'true'
        shell: bash
        env:
          FABRIC_TOKEN: ${{ steps.token.outputs.token }}
          OPERATION_URL: ${{ steps.deploy.outputs.operation_url }}
        run: |
          for ATTEMPT in {1..30}; do
            RESPONSE=$(curl --fail-with-body -sS \
              "$OPERATION_URL" \
              -H "Authorization: Bearer ${FABRIC_TOKEN}")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Dev to Test deployment succeeded."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "Dev to Test deployment failed."
              echo "$RESPONSE" | jq
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Fabric deployment."
          exit 1



      - name: Run Test pipeline
        id: test_pipeline
        shell: bash
        env:
          FABRIC_TOKEN: ${{ steps.token.outputs.token }}
          TEST_WORKSPACE_ID: ${{ vars.FABRIC_TEST_WORKSPACE_ID }}
          TEST_PIPELINE_ID: ${{ vars.FABRIC_TEST_PIPELINE_ID }}
        run: |
          HEADERS_FILE=$(mktemp)
          BODY_FILE=$(mktemp)

          HTTP_CODE=$(curl -sS \
            -D "$HEADERS_FILE" \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -X POST \
            "https://api.fabric.microsoft.com/v1/workspaces/${TEST_WORKSPACE_ID}/dataPipelines/${TEST_PIPELINE_ID}/jobs/execute/instances" \
            -H "Authorization: Bearer ${FABRIC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Test pipeline HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "202" ]; then
            echo "Failed to start Test pipeline:"
            cat "$BODY_FILE"
            exit 1
          fi

          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {print $2}' "$HEADERS_FILE" | tr -d '\r')

          if [ -z "$LOCATION" ]; then
            echo "No job Location header returned."
            exit 1
          fi

          echo "job_url=$LOCATION" >> "$GITHUB_OUTPUT"

          echo "Test pipeline started."

      - name: Wait for Test pipeline validation
        shell: bash
        env:
          FABRIC_TOKEN: ${{ steps.token.outputs.token }}
          JOB_URL: ${{ steps.test_pipeline.outputs.job_url }}
        run: |
          for ATTEMPT in {1..40}; do
            RESPONSE=$(curl --fail-with-body -sS \
              "$JOB_URL" \
              -H "Authorization: Bearer ${FABRIC_TOKEN}")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Test pipeline status: $STATUS"

            if [ "$STATUS" = "Completed" ]; then
              echo "Test pipeline and validation passed."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "Deduped" ]; then
              echo "Test validation failed."
              echo "$RESPONSE" | jq
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for Test pipeline."
          exit 1

        
      - name: Deploy Test to Production
        id: deploy_prod
        shell: bash
        env:
          FABRIC_TOKEN: ${{ steps.token.outputs.token }}
          DEPLOYMENT_PIPELINE_ID: ${{ vars.FABRIC_DEPLOYMENT_PIPELINE_ID }}
          TEST_STAGE_ID: ${{ vars.FABRIC_TEST_STAGE_ID }}
          PROD_STAGE_ID: ${{ vars.FABRIC_PROD_STAGE_ID }}
        run: |
          HEADERS_FILE=$(mktemp)
          BODY_FILE=$(mktemp)

          HTTP_CODE=$(curl -sS \
            -D "$HEADERS_FILE" \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -X POST \
            "https://api.fabric.microsoft.com/v1/deploymentPipelines/${DEPLOYMENT_PIPELINE_ID}/deploy" \
            -H "Authorization: Bearer ${FABRIC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sourceStageId\": \"${TEST_STAGE_ID}\",
              \"targetStageId\": \"${PROD_STAGE_ID}\",
              \"note\": \"GitHub Actions Test to Production deployment\"
            }")

          echo "Production deployment HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production deployment completed immediately."
            echo "completed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP_CODE" != "202" ]; then
            echo "Production deployment request failed:"
            cat "$BODY_FILE"
            exit 1
          fi

          LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {print $2}' "$HEADERS_FILE" | tr -d '\r')

          if [ -z "$LOCATION" ]; then
            echo "Fabric returned 202 but no Location header."
            exit 1
          fi

          echo "operation_url=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "completed=false" >> "$GITHUB_OUTPUT"

          echo "Production deployment started."

      - name: Wait for Production deployment
        if: steps.deploy_prod.outputs.completed != 'true'
        shell: bash
        env:
          FABRIC_TOKEN: ${{ steps.token.outputs.token }}
          OPERATION_URL: ${{ steps.deploy_prod.outputs.operation_url }}
        run: |
          for ATTEMPT in {1..30}; do
            RESPONSE=$(curl --fail-with-body -sS \
              "$OPERATION_URL" \
              -H "Authorization: Bearer ${FABRIC_TOKEN}")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Production deployment status: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "Test to Production deployment succeeded."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "Production deployment failed."
              echo "$RESPONSE" | jq
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Production deployment."
          exit 1
