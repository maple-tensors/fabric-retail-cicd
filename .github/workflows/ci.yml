name: Fabric CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check expected Fabric artifacts exist
        run: |
          test -d fabric/lh_retail.Lakehouse
          test -d fabric/nb_transform_sales.Notebook
          test -d fabric/pl_daily_sales.DataPipeline

      - name: Run Python tests
        run: pytest -q
